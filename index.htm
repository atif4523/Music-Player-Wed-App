<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
</head>

<body>
    <div class="container flex bg_black">
        <div class="left ">
            <div class="home bg_gray rounded p1 M1">
                <div class="cross">
                    <img class ="invert" src="cross.svg" alt="" class="src">
                </div>
                <img width="100px" class="invert M1" src="logo.svg" alt="">
                <ul class="M1">
                    <li>
                        <img class="invert" src="home.svg" alt="">Home
                    </li>
                    <li>
                        <img class="invert" src="search.svg" alt="">Search
                    </li>
                </ul>
            </div>
            <div class="lib bg_gray rounded M1 p1">
                <div class="heading">
                    <img class="invert" src="lib.svg" alt="">
                    Your library
                </div>
                <div class="lib1 bg_gray1 rounded p1">
                    <div class="songList">
                        <ul>
                        </ul>
                    </div>
                    <h3>
                        Create your first playlist
                    </h3>
                    It's easy, we'll help you
                    <div class="btn">
                        <button>
                            Create playlist
                        </button>
                    </div>
                </div>
                <div class="lib2 bg_gray1 rounded p1">
                    <h3>Let's find some podcasts to follow</h3>
                    We'll keep you updated on new episodes
                    <div class="btn">
                        <button>
                            Browse podcasts
                        </button>
                    </div>
                </div>
                <div class="footer bg_gray flex ">
                    <ul class="flex font10">
                        <li>
                            legal
                        </li>
                        <li>Safety and Privacy Center</li>
                        <li>
                            Privacy
                        </li>
                    </ul>

                </div>
                <div class="btn1">
                    <button>
                        English
                    </button>
                </div>
            </div>
        </div>
        <div class="right  bg_gray rounded ">
            <div class="header ">
                <div class="ham">
                    <img id="hamburger" class="invert" src="hamburger.svg" alt="">
                    <div class="nav ">
                        <img src="spodify_arrow2.svg" alt="">
                        <img src="spodify_arrow1.svg" alt="">
                    </div>
                </div>
                <div class="button">
                    <button class="signupBtn">Sign up</button>
                    <button class="loginBtn">Log in</button>
                </div>
            </div>
            <div class="spodify_playlist">
                <h1>
                    Spodify playlists
                </h1>
                <div class="cardContainer">

                </div>
            </div>
            <div class="playbar">
                <div class="seekBar">
                    <div class="circle">

                    </div>
                </div>
                    <div class="songInfo">

                    </div>
                    <div class="songButton">
                        <img width  ="30px"  id="prev" src="prevSong.svg" alt="">
                        <img width  ="30px" id="PLAY" src="playsong.svg" alt="">
                        <img width  ="30px" id="next" src="nextSong.svg" alt="">
                    </div>
                    <div class="songTime">
                        
                    </div>
                    <div   class="volume">
                        <img width ="30px" src="volume.svg" alt="">
                        <div class="range">
                            <input type="range" name="volume" id="">
                        </div>
                    </div>
            
              
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
